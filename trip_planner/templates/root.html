{% extends "base.html" %}

{% block main %}
    {% if g.user %}
        <h1>Greetings {{ g.user.username }}</h1>
        <p>See your trips <a href="{{ url_for('trips.index') }}">here.</a>
    {% else %}
        <h1>Welcome to Travelpiggy!</h1>
        <p>Please <a href="{{ url_for('auth.login') }}">sign in</a> to see your trips.</p>
    {% endif %}
{% endblock %}
