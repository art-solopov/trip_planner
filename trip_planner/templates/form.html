{% extends "base.html" %}

{% block main %}
    <h1>{{ title }}</h1>

    {% if description -%}
        <div class="surface-container small-padding vertical-margin">{{ description }}</div>
    {%- endif %}

    <form action="{{ form_action | default(request.path) }}" method="{{ form_method | default('POST') }}" class="{{ form_class }}">
        {% include "_form.html" with context %}
    </form>
{% endblock %}
